name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: FFmpeg (the tests really convert and merge media)
        run: |
          if command -v ffmpeg >/dev/null; then ffmpeg -version | head -1; else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      # unit, API and browser tests; the opt-in real-YouTube tests (marker "network") are not run
      - run: pytest -q
