name: telegram-media-bot

on:
  push:
    branches: [main]
    paths: ["telegram-media-bot/**", ".github/workflows/telegram-media-bot.yml"]
  pull_request:
    paths: ["telegram-media-bot/**", ".github/workflows/telegram-media-bot.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: telegram-media-bot

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: telegram-media-bot/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: The walkthrough runs
        run: python scripts/walkthrough.py > /dev/null
