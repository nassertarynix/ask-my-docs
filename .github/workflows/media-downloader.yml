name: media-downloader

on:
  push:
    branches: [main]
    paths: ["media-downloader/**", ".github/workflows/media-downloader.yml"]
  pull_request:
    paths: ["media-downloader/**", ".github/workflows/media-downloader.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: media-downloader

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: media-downloader/requirements-dev.txt
      - name: FFmpeg (the tests really convert and merge media)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      # unit, API and browser tests; the opt-in real-YouTube tests (marker "network") are not run
      - run: pytest -q
